[package]
name = "plain-sight"
version = "1.0.0"
description = "Plain Sight as a desktop app: the web page in a native window"
authors = ["Pranav Ongole"]
license = "MIT"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = [] }
# The system folder picker. Used directly, without tauri-plugin-dialog, which
# would add three more crates and a script in the page (folder.rs). Its default
# features are Linux backends only.
rfd = { version = "=0.17.2", default-features = false }
# The { name } object the folder commands return. Already used by Tauri.
serde = { version = "1", features = ["derive"] }

# macOS: AppKit and WebKit calls for quitting like Esc and the "Quit without
# saving?" sheet (quit.rs), for the web view's configuration and the window's
# restoration setting (main.rs), and
# Foundation's bookmarks for the remembered folder (bookmark.rs). The versions
# are the ones Tauri already uses, so nothing new is downloaded.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "NSAlert", "NSApplication", "NSButton", "NSControl", "NSResponder", "NSView", "NSWindow", "NSWindowRestoration"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFRunLoop", "block2"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSError", "NSFileManager", "NSPathUtilities", "NSString", "NSURL"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "WKWebViewConfiguration"] }
# Test builds only, for the e2e feature below.
serde_json = { version = "1", optional = true }

[features]
# End-to-end test builds only (src/e2e.rs): the tests read the page, take
# pictures of it and ask for the quit paths. Never part of the release app:
# `npm run app:build` builds without it, and `npm run build:e2e` builds it into
# its own target folder.
e2e = [
  "dep:serde_json",
  "objc2-app-kit/NSBitmapImageRep",
  "objc2-app-kit/NSImage",
  "objc2-app-kit/NSImageRep",
  "objc2-web-kit/WKSnapshotConfiguration",
  "objc2-web-kit/WKWebView",
  "objc2-web-kit/block2",
  "objc2-web-kit/objc2-app-kit",
]

# The "Quit without saving?" sheet's buttons, read without showing the sheet
# (tests/quit_sheet.rs, D-48). AppKit makes windows on the main thread only,
# so that test has its own main instead of the test harness's threads.
[[test]]
name = "quit_sheet"
harness = false

# That test's own needs, in test builds only: the activation policy that keeps
# it out of the Dock (NSRunningApplication) and the buttons' modifier masks
# (NSEvent). The same crate as above, so nothing new is downloaded.
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSAlert", "NSApplication", "NSButton", "NSControl", "NSEvent", "NSResponder", "NSRunningApplication", "NSView"] }

# Smallest binary rather than fastest build (DR-06).
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
